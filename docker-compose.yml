version: '3.8'

services:
  rick-ai-expert:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RICK_HOST=0.0.0.0
      - RICK_PORT=8080
      - RICK_DEBUG=false
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Optional: PostgreSQL for production knowledge base
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=rick_knowledge
      - POSTGRES_USER=rick
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rick_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: