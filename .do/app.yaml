# DigitalOcean App Platform configuration for Rick AI Expert
name: rick-ai-expert
region: nyc
services:
- name: rick-api
  source_dir: /
  github:
    repo: your-repo/rick-ai-expert
    branch: main
  run_command: python rick_with_rag.py
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 8081
  health_check:
    http_path: /health
  envs:
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    type: SECRET
  - key: PRODUCTION
    value: "true"
    scope: RUN_TIME
    type: GENERAL
  - key: PORT
    value: "8081"
    scope: RUN_TIME
    type: GENERAL

# Scaling and performance
scaling:
  min_instance_count: 1
  max_instance_count: 3
  target_cpu_utilization: 70
  target_memory_utilization: 80

# Features
features:
- buildpack-stack-20