<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick - Anterix AI Expert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: calc(100vh - 120px);
        }
        .message-bubble {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .typing-indicator {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .anterix-gradient {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <!-- Header -->
    <header class="anterix-gradient text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center">
                        <i class="fas fa-robot text-blue-600 text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold">Rick</h1>
                        <p class="text-blue-100">Anterix Technology Expert</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-right">
                        <div class="text-sm text-blue-100">Status</div>
                        <div id="connection-status" class="text-white font-semibold">Connecting...</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Chat Interface -->
    <div class="container mx-auto px-4 py-6">
        <div class="max-w-4xl mx-auto">
            <!-- Chat Container -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <!-- Chat Messages -->
                <div id="chat-messages" class="chat-container overflow-y-auto p-6 space-y-4">
                    <!-- Messages will be inserted here -->
                </div>

                <!-- Suggestions -->
                <div id="suggestions-container" class="px-6 py-4 border-t border-gray-200">
                    <div class="text-sm text-gray-600 mb-2">Try asking:</div>
                    <div id="suggestions" class="flex flex-wrap gap-2">
                        <!-- Suggestions will be loaded here -->
                    </div>
                </div>

                <!-- Input Area -->
                <div class="border-t border-gray-200 p-4">
                    <div class="flex space-x-4">
                        <div class="flex-1">
                            <textarea
                                id="message-input"
                                placeholder="Ask Rick about Anterix solutions, Private LTE, grid modernization..."
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                                rows="2"
                            ></textarea>
                        </div>
                        <button
                            id="send-button"
                            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition-colors duration-200 flex items-center space-x-2"
                        >
                            <i class="fas fa-paper-plane"></i>
                            <span>Send</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Knowledge Base Info -->
            <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white rounded-lg shadow p-4">
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-database text-blue-600 text-xl"></i>
                        <div>
                            <div class="font-semibold">Knowledge Base</div>
                            <div id="kb-stats" class="text-sm text-gray-600">Loading...</div>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-4">
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-brain text-green-600 text-xl"></i>
                        <div>
                            <div class="font-semibold">AI Engine</div>
                            <div id="ai-status" class="text-sm text-gray-600">Ready</div>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-4">
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-clock text-purple-600 text-xl"></i>
                        <div>
                            <div class="font-semibold">Response Time</div>
                            <div id="response-time" class="text-sm text-gray-600">< 2 seconds</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        class RickChat {
            constructor() {
                this.ws = null;
                this.clientId = this.generateClientId();
                this.isConnected = false;
                this.messageInput = document.getElementById('message-input');
                this.sendButton = document.getElementById('send-button');
                this.messagesContainer = document.getElementById('chat-messages');
                this.connectionStatus = document.getElementById('connection-status');

                this.init();
            }

            generateClientId() {
                return 'client_' + Math.random().toString(36).substr(2, 9);
            }

            init() {
                this.connectWebSocket();
                this.setupEventListeners();
                this.loadSuggestions();
                this.loadKnowledgeBaseStats();
            }

            connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws/${this.clientId}`;

                this.ws = new WebSocket(wsUrl);

                this.ws.onopen = () => {
                    this.isConnected = true;
                    this.connectionStatus.textContent = 'Connected';
                    this.connectionStatus.className = 'text-green-400 font-semibold';
                    console.log('Connected to Rick');
                };

                this.ws.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    this.handleMessage(message);
                };

                this.ws.onclose = () => {
                    this.isConnected = false;
                    this.connectionStatus.textContent = 'Disconnected';
                    this.connectionStatus.className = 'text-red-400 font-semibold';

                    // Attempt to reconnect after 3 seconds
                    setTimeout(() => {
                        if (!this.isConnected) {
                            this.connectWebSocket();
                        }
                    }, 3000);
                };

                this.ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    this.connectionStatus.textContent = 'Error';
                    this.connectionStatus.className = 'text-red-400 font-semibold';
                };
            }

            setupEventListeners() {
                this.sendButton.addEventListener('click', () => this.sendMessage());

                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                // Auto-resize textarea
                this.messageInput.addEventListener('input', () => {
                    this.messageInput.style.height = 'auto';
                    this.messageInput.style.height = this.messageInput.scrollHeight + 'px';
                });
            }

            sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message || !this.isConnected) return;

                // Add user message to chat
                this.addMessage({
                    type: 'message',
                    speaker: 'You',
                    content: message,
                    timestamp: new Date().toISOString(),
                    isUser: true
                });

                // Send to WebSocket
                this.ws.send(JSON.stringify({
                    type: 'chat',
                    message: message
                }));

                // Clear input
                this.messageInput.value = '';
                this.messageInput.style.height = 'auto';

                // Hide suggestions
                document.getElementById('suggestions-container').style.display = 'none';
            }

            handleMessage(message) {
                if (message.type === 'message') {
                    this.addMessage(message);
                } else if (message.type === 'typing') {
                    this.showTypingIndicator();
                } else if (message.type === 'feedback_ack') {
                    this.showNotification(message.content, 'success');
                }
            }

            addMessage(message) {
                // Remove typing indicator if present
                this.removeTypingIndicator();

                const messageElement = document.createElement('div');
                messageElement.className = `message-bubble ${message.isUser ? 'text-right' : 'text-left'}`;

                const bubbleClass = message.isUser
                    ? 'bg-blue-600 text-white ml-auto'
                    : 'bg-gray-100 text-gray-800 mr-auto';

                let actionsHtml = '';
                if (message.suggested_actions && message.suggested_actions.length > 0) {
                    const actionButtons = message.suggested_actions.map(action =>
                        `<button class="inline-block mt-2 mr-2 px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm hover:bg-blue-200 transition-colors">
                            ${action}
                        </button>`
                    ).join('');
                    actionsHtml = `<div class="mt-2">${actionButtons}</div>`;
                }

                let sourcesHtml = '';
                if (message.knowledge_sources && message.knowledge_sources.length > 0) {
                    const sources = message.knowledge_sources.slice(0, 2).map(source =>
                        `<div class="text-xs text-gray-500 mt-1">
                            📄 <a href="${source.url}" target="_blank" class="hover:underline">${source.title}</a>
                        </div>`
                    ).join('');
                    sourcesHtml = `<div class="mt-2">${sources}</div>`;
                }

                messageElement.innerHTML = `
                    <div class="flex items-start space-x-3 ${message.isUser ? 'flex-row-reverse space-x-reverse' : ''}">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center ${message.isUser ? 'bg-blue-600' : 'bg-gray-300'}">
                            <i class="fas ${message.isUser ? 'fa-user' : 'fa-robot'} text-white text-sm"></i>
                        </div>
                        <div class="max-w-xs lg:max-w-md px-4 py-2 rounded-lg ${bubbleClass}">
                            <div class="whitespace-pre-wrap">${this.formatMessage(message.content)}</div>
                            ${actionsHtml}
                            ${sourcesHtml}
                        </div>
                    </div>
                `;

                this.messagesContainer.appendChild(messageElement);
                this.scrollToBottom();
            }

            formatMessage(content) {
                // Basic markdown-like formatting
                return content
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/• /g, '• ')
                    .replace(/\n/g, '<br>');
            }

            showTypingIndicator() {
                this.removeTypingIndicator();

                const typingElement = document.createElement('div');
                typingElement.id = 'typing-indicator';
                typingElement.className = 'typing-indicator flex items-center space-x-3 text-left';
                typingElement.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center">
                        <i class="fas fa-robot text-white text-sm"></i>
                    </div>
                    <div class="bg-gray-100 text-gray-600 px-4 py-2 rounded-lg">
                        Rick is typing...
                    </div>
                `;

                this.messagesContainer.appendChild(typingElement);
                this.scrollToBottom();
            }

            removeTypingIndicator() {
                const typingIndicator = document.getElementById('typing-indicator');
                if (typingIndicator) {
                    typingIndicator.remove();
                }
            }

            scrollToBottom() {
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            async loadSuggestions() {
                try {
                    const response = await fetch('/api/suggestions');
                    const data = await response.json();

                    const suggestionsContainer = document.getElementById('suggestions');
                    suggestionsContainer.innerHTML = data.suggestions.map(suggestion =>
                        `<button class="suggestion-btn px-3 py-2 bg-blue-100 text-blue-700 rounded-lg text-sm hover:bg-blue-200 transition-colors">
                            ${suggestion.text}
                        </button>`
                    ).join('');

                    // Add click handlers to suggestions
                    document.querySelectorAll('.suggestion-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            this.messageInput.value = btn.textContent.trim();
                            this.sendMessage();
                        });
                    });
                } catch (error) {
                    console.error('Failed to load suggestions:', error);
                }
            }

            async loadKnowledgeBaseStats() {
                try {
                    const response = await fetch('/api/knowledge/stats');
                    const stats = await response.json();

                    document.getElementById('kb-stats').textContent =
                        `${stats.total_items} items loaded`;
                } catch (error) {
                    document.getElementById('kb-stats').textContent = 'Stats unavailable';
                }
            }

            showNotification(message, type = 'info') {
                // Simple notification system
                const notification = document.createElement('div');
                notification.className = `fixed top-4 right-4 px-4 py-2 rounded-lg text-white z-50 ${
                    type === 'success' ? 'bg-green-500' : 'bg-blue-500'
                }`;
                notification.textContent = message;

                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
        }

        // Initialize chat when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new RickChat();
        });
    </script>
</body>
</html>
