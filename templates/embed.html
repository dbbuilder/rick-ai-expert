<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anterix Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-widget {
            height: 500px;
            width: 100%;
            max-width: 400px;
        }
        .message-bubble {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anterix-blue {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
        }
    </style>
</head>
<body class="bg-white">
    <!-- Embeddable Chat Widget -->
    <div class="chat-widget bg-white border border-gray-300 rounded-lg shadow-lg overflow-hidden">
        <!-- Header -->
        <div class="anterix-blue text-white p-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                    <i class="fas fa-robot text-blue-600"></i>
                </div>
                <div>
                    <h3 class="font-bold">Rick</h3>
                    <p class="text-xs text-blue-100">Anterix Expert</p>
                </div>
                <div class="ml-auto">
                    <div id="widget-status" class="w-2 h-2 bg-green-400 rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="widget-messages" class="h-80 overflow-y-auto p-4 space-y-3 bg-gray-50">
            <!-- Initial message -->
            <div class="message-bubble">
                <div class="flex items-start space-x-2">
                    <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center">
                        <i class="fas fa-robot text-white text-xs"></i>
                    </div>
                    <div class="bg-white px-3 py-2 rounded-lg shadow-sm text-sm max-w-xs">
                        Hi! I'm Rick, your Anterix expert. Ask me about Private LTE, grid modernization, or any Anterix solutions!
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="px-4 py-2 border-t border-gray-200">
            <div class="flex flex-wrap gap-1">
                <button class="quick-action text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200">
                    Private LTE
                </button>
                <button class="quick-action text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200">
                    900 MHz
                </button>
                <button class="quick-action text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200">
                    Grid Modernization
                </button>
            </div>
        </div>

        <!-- Input -->
        <div class="p-4 border-t border-gray-200">
            <div class="flex space-x-2">
                <input
                    id="widget-input"
                    type="text"
                    placeholder="Ask Rick..."
                    class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                >
                <button
                    id="widget-send"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg"
                >
                    <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Widget JavaScript -->
    <script>
        class AnterixChatWidget {
            constructor() {
                this.ws = null;
                this.clientId = 'widget_' + Math.random().toString(36).substr(2, 9);
                this.isConnected = false;

                this.input = document.getElementById('widget-input');
                this.sendBtn = document.getElementById('widget-send');
                this.messages = document.getElementById('widget-messages');
                this.status = document.getElementById('widget-status');

                this.init();
            }

            init() {
                this.connectWebSocket();
                this.setupEventListeners();
            }

            connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws/${this.clientId}`;

                this.ws = new WebSocket(wsUrl);

                this.ws.onopen = () => {
                    this.isConnected = true;
                    this.status.className = 'w-2 h-2 bg-green-400 rounded-full';
                };

                this.ws.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    if (message.type === 'message' && message.speaker === 'Rick') {
                        this.addRickMessage(message.content);
                    }
                };

                this.ws.onclose = () => {
                    this.isConnected = false;
                    this.status.className = 'w-2 h-2 bg-red-400 rounded-full';

                    // Reconnect after 3 seconds
                    setTimeout(() => this.connectWebSocket(), 3000);
                };
            }

            setupEventListeners() {
                this.sendBtn.addEventListener('click', () => this.sendMessage());

                this.input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendMessage();
                    }
                });

                // Quick action buttons
                document.querySelectorAll('.quick-action').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.input.value = `Tell me about ${btn.textContent}`;
                        this.sendMessage();
                    });
                });
            }

            sendMessage() {
                const message = this.input.value.trim();
                if (!message || !this.isConnected) return;

                // Add user message
                this.addUserMessage(message);

                // Send to WebSocket
                this.ws.send(JSON.stringify({
                    type: 'chat',
                    message: message
                }));

                this.input.value = '';
            }

            addUserMessage(content) {
                const messageEl = document.createElement('div');
                messageEl.className = 'message-bubble text-right';
                messageEl.innerHTML = `
                    <div class="flex items-start space-x-2 flex-row-reverse space-x-reverse">
                        <div class="w-6 h-6 rounded-full bg-gray-400 flex items-center justify-center">
                            <i class="fas fa-user text-white text-xs"></i>
                        </div>
                        <div class="bg-blue-600 text-white px-3 py-2 rounded-lg text-sm max-w-xs">
                            ${content}
                        </div>
                    </div>
                `;
                this.messages.appendChild(messageEl);
                this.scrollToBottom();
            }

            addRickMessage(content) {
                const messageEl = document.createElement('div');
                messageEl.className = 'message-bubble';
                messageEl.innerHTML = `
                    <div class="flex items-start space-x-2">
                        <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center">
                            <i class="fas fa-robot text-white text-xs"></i>
                        </div>
                        <div class="bg-white px-3 py-2 rounded-lg shadow-sm text-sm max-w-xs">
                            ${this.formatMessage(content)}
                        </div>
                    </div>
                `;
                this.messages.appendChild(messageEl);
                this.scrollToBottom();
            }

            formatMessage(content) {
                return content
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\n/g, '<br>');
            }

            scrollToBottom() {
                this.messages.scrollTop = this.messages.scrollHeight;
            }
        }

        // Initialize widget
        document.addEventListener('DOMContentLoaded', () => {
            new AnterixChatWidget();
        });

        // Expose widget for parent page communication
        window.AnterixChatWidget = AnterixChatWidget;
    </script>
</body>
</html>
