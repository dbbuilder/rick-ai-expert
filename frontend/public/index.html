<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />

      content="Rick - Anterix AI Expert. Get instant answers about Private LTE, grid modernization, and critical infrastructure solutions."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rick - Anterix AI Expert" />
    <meta property="og:description" content="Get instant answers about Private LTE, grid modernization, and critical infrastructure solutions from Rick, your Anterix AI assistant." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:url" content="https://rick.anterix.com" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rick - Anterix AI Expert" />
    <meta name="twitter:description" content="Get instant answers about Private LTE, grid modernization, and critical infrastructure solutions." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Favicon variations -->
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">

    <title>Rick - Anterix AI Expert</title>

    <!-- Preload critical resources -->
    <link rel="preload" href="https://cdn.tailwindcss.com" as="style">

    <!-- Analytics placeholder -->
    <!-- Google Analytics or other analytics code would go here -->
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Rick - Anterix AI Expert requires JavaScript to function properly.</p>
        <p>Please enable JavaScript in your browser and refresh the page.</p>
      </div>
    </noscript>

    <div id="root"></div>

    <!-- Loading screen while React loads -->
    <style>
      #root:empty::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
        z-index: 9999;
      }

      #root:empty::after {
        content: 'Loading Rick...';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 500;
        z-index: 10000;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </body>
</html>
